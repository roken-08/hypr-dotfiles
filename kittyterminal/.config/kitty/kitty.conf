
font_family      JetBrains Mono Nerd Font
font_size 11.0


cursor_shape beam
cursor_trail 1


window_margin_width 21.75


confirm_os_window_close 0
# don't reopen at the last window's size/state: after a maximized kitty closed,
# every new one asked Hyprland to start maximized ("goes fullscreen") instead
# of tiling. Hyprland sizes tiled windows anyway.
remember_window_size no


shell zsh



map ctrl+c    copy_or_interrupt


map ctrl+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f   launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id


map page_up    scroll_page_up
map page_down    scroll_page_down

map ctrl+plus  change_font_size all +1
map ctrl+equal  change_font_size all +1
map ctrl+kp_add  change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore       change_font_size all -1
map ctrl+kp_subtract       change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0

# Ctrl+Backspace deletes the previous word (Windows/browser behaviour).
# Sends ^W, which zsh and fish both read as backward-kill-word.
map ctrl+backspace send_text all \x17


background_opacity 0.50
scrollbar_handle_opacity 0
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0

sync_to_monitor no

# Colours come from the theme engine (orrery-theme set <name>).
include ~/.config/orrery/current/kitty.conf

# Font family and size follow `orrery-font set <name>` / `orrery-text-size <px>`
# (written per machine, so this file keeps its own defaults above). Missing
# until one of those commands has run once.
include ~/.config/orrery/ui/kitty.conf
include themes/noctalia.conf
